<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <title>USDT شام | تداول ند للند في سوريا</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        function stubPush() {
          try {
            var cap = window.Capacitor;
            if (!cap) return;
            var plugins = cap.Plugins || (cap.Plugins = {});
            var noop = function () { return Promise.resolve({ receive: "granted" }); };
            plugins.PushNotifications = {
              register: function () { return Promise.resolve({}); },
              unregister: function () { return Promise.resolve(); },
              requestPermissions: noop,
              checkPermissions: noop,
              getDeliveredNotifications: function () { return Promise.resolve({ notifications: [] }); },
              removeAllDeliveredNotifications: function () { return Promise.resolve(); },
              addListener: function () { return Promise.resolve({ remove: function () {} }); },
              removeAllListeners: function () { return Promise.resolve(); }
            };
            if (typeof cap.toNative === "function" && !cap.__shamPushGuard) {
              var native = cap.toNative.bind(cap);
              cap.toNative = function (plugin, method, options, callback) {
                if (String(plugin || "") === "PushNotifications" && String(method || "") === "register") {
                  return "";
                }
                return native(plugin, method, options, callback);
              };
              cap.__shamPushGuard = true;
            }
          } catch (e) {}
        }
        stubPush();
        document.addEventListener("deviceready", stubPush);
        setTimeout(stubPush, 0);
        setTimeout(stubPush, 300);
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        try { tg.ready(); } catch (e) {}
        try { tg.expand(); } catch (e) {}
        try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
        try { if (tg.setHeaderColor) tg.setHeaderColor("#06080b"); } catch (e) {}
        try { if (tg.setBackgroundColor) tg.setBackgroundColor("#06080b"); } catch (e) {}
        document.documentElement.classList.add("tg-app");
        if (document.body) document.body.classList.add("tg-app");
      })();
    </script>
    <style>
      html, body { background: #07090c; margin: 0; }
      #root:empty { min-height: 100vh; background: #07090c; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
